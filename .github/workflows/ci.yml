name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest

  harbor-tests:
    name: Harbor Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies with Harbor
        run: uv sync --frozen --group harbor

      - name: Run Harbor tests
        run: uv run pytest tests/test_harbor.py

  coverage:
    name: Coverage (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies with Harbor
        run: uv sync --frozen --group harbor

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=portex_eval \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage Summary"
            echo
            uv run python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: |
            coverage.xml
            htmlcov/
            .coverage
          if-no-files-found: error
