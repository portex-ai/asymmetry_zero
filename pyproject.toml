[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portex-eval"
version = "0.1.0"
description = "Lightweight evaluation framework for LLM judges and candidates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Portex AI"},
]
keywords = ["llm", "evaluation", "benchmark", "judges"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
]

[project.scripts]
portex-eval = "portex_eval.cli:app"

[project.optional-dependencies]
providers = [
    "httpx>=0.25.0",
]
inspect = [
    "inspect-ai>=0.3.0",
]
all = [
    "httpx>=0.25.0",
    "inspect-ai>=0.3.0",
]
dev = [
    "httpx>=0.25.0",
    "inspect-ai>=0.3.0",
    "pandas>=2.0",
    "pandas-stubs>=2.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["portex_eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["portex-bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = "portex-bench"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
